# Pathless 第三方源码引用表（方案 B）
#
# 仓名固定（勿改名腾位；勿使用 *-legacy-mirror）：
#   pathless-u-boot / pathless-rkbin / pathless-linux-rockchip / pathless-linux-stable
#
# 产品分支（与 Armbian BRANCH 同名）：vendor | current | edge | bleedingedge
#
# 内核为何两仓：
#   - vendor：Rockchip BSP → pathless-linux-rockchip（Fork armbian/linux-rockchip）
#   - current/edge/bleedingedge：主线 stable → pathless-linux-stable（Fork gregkh/linux）
#   主线对象无法靠浅克隆推进 BSP Fork（GitHub 拒绝/500），故主线用独立自有 Fork，仍用同名产品分支。
#
# 同步：tools/pathless/sync-three-repos.sh
# 说明：config/sources/README.pathless.md
# 国内加速：pathless-china-mirrors.conf + tools/pathless/setup-china-speed.sh

_pathless_conf_dir="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
# shellcheck source=/dev/null
[[ -f "${_pathless_conf_dir}/pathless-china-mirrors.conf" ]] && source "${_pathless_conf_dir}/pathless-china-mirrors.conf"
unset _pathless_conf_dir

[[ -z ${PATHLESS_GIT_SERVER:-} ]] && PATHLESS_GIT_SERVER="https://github.com/Tron-Z"

PATHLESS_KERNEL_BSP_REPO="${PATHLESS_GIT_SERVER}/pathless-linux-rockchip.git"
PATHLESS_KERNEL_MAINLINE_REPO="${PATHLESS_GIT_SERVER}/pathless-linux-stable.git"
PATHLESS_UBOOT_REPO="${PATHLESS_GIT_SERVER}/pathless-u-boot.git"
PATHLESS_RKBIN_REPO="${PATHLESS_GIT_SERVER}/pathless-rkbin.git"

# 兼容旧变量名（默认指 BSP 仓）
PATHLESS_KERNEL_REPO="${PATHLESS_KERNEL_BSP_REPO}"

PATHLESS_PRODUCT_BRANCHES="vendor current edge bleedingedge"

# ---------- 上游映射（仅同步脚本）----------
PATHLESS_KERNEL_BSP_UPSTREAM="https://github.com/armbian/linux-rockchip.git"
PATHLESS_KERNEL_BSP_UPSTREAM_VENDOR="rk-6.1-rkr7.2"

PATHLESS_KERNEL_MAINLINE_UPSTREAM="https://github.com/gregkh/linux.git"
PATHLESS_KERNEL_MAINLINE_UPSTREAM_CURRENT="linux-6.18.y"
PATHLESS_KERNEL_MAINLINE_UPSTREAM_EDGE="linux-7.2.y"
# bleedingedge：gregkh 暂无 linux-7.3.y 时跟 master（或日后改 tag）
PATHLESS_KERNEL_MAINLINE_UPSTREAM_BLEEDINGEDGE="master"

PATHLESS_UBOOT_UPSTREAM="https://github.com/u-boot/u-boot.git"
PATHLESS_UBOOT_UPSTREAM_VENDOR="v2026.01"
PATHLESS_UBOOT_UPSTREAM_CURRENT="v2026.01"
PATHLESS_UBOOT_UPSTREAM_EDGE="v2026.01"
PATHLESS_UBOOT_UPSTREAM_BLEEDINGEDGE="v2026.01"

PATHLESS_RKBIN_UPSTREAM="https://github.com/armbian/rkbin.git"
PATHLESS_RKBIN_UPSTREAM_VENDOR="master"
PATHLESS_RKBIN_UPSTREAM_CURRENT="master"
PATHLESS_RKBIN_UPSTREAM_EDGE="master"
PATHLESS_RKBIN_UPSTREAM_BLEEDINGEDGE="master"
