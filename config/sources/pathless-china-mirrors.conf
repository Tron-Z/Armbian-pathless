# Pathless 国内加速默认（编译过程内：apt / GitHub / GHCR-ORAS / 主线 git）
#
# 原则：
#   1) 能做成自有仓的 → pathless-sources.conf（内核/U-Boot/rkbin）
#   2) 不能自有仓的 → 国内镜像，不直连官方慢源
#   3) 显式命令行/环境变量优先（此处仅在未设置时给默认）
#
# Docker「构建环境镜像」的 pull 不走 GHCR_MIRROR，须在
# userpatches/config-pathless.conf 设 DOCKER_ARMBIAN_BASE_COORDINATE_PREFIX
# （见 tools/pathless/setup-china-speed.sh）。
#
# 不要用 Armbian china 默认的 UBOOT_MIRROR=gitee（会卡 Gitee 登录）。
# GitHub 走 https://gh-proxy.com/https://github.com/... （见 https://gh-proxy.com/ ）
# 容器必须能解析 gh-proxy.com：局域网 DNS 不行时由 config-pathless.conf 传入 --dns。
# tuna ubuntu-ports 常 403，arm64 改走阿里云。

REGIONAL_MIRROR="${REGIONAL_MIRROR:-china}"
UBOOT_MIRROR="${UBOOT_MIRROR:-github}"
GITHUB_MIRROR="${GITHUB_MIRROR:-ghproxy}"
GHPROXY_ADDRESS="${GHPROXY_ADDRESS:-gh-proxy.com}"
CUSTOM_UBUNTU_MIRROR_PORTS="${CUSTOM_UBUNTU_MIRROR_PORTS:-mirrors.aliyun.com/ubuntu-ports/}"
SKIP_ARMBIAN_REPO="${SKIP_ARMBIAN_REPO:-yes}"
