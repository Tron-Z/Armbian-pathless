# Pathless RK3566
# 硬件参考：Orange Pi 3B V1.0（RK3566），工程内全部使用 Pathless 自有路径/文件名
#
# 自有启动资源：
#   BOOT_FDT_FILE → rockchip/rk3566-pathless-3b.dtb
#     vendor：patch/kernel/rk35xx-vendor-6.1/dt/rk3566-pathless-3b.dts
#     current/edge/bleedingedge：patch/kernel/archive/rockchip64-{6.18,7.2,7.3}/dt/
#   BOOTCONFIG    → patch/u-boot/v2026.01/defconfig/pathless-rk3566_defconfig
#   U-Boot DT     → patch/u-boot/v2026.01/dt_uboot + dt_upstream_rockchip（rk3566-pathless-3b*）
#   蓝牙 BSP      → packages/bsp/pathless-rk3566/
# 第三方源码三仓（方案 B）：config/sources/pathless-sources.conf
#   内核 / U-Boot / rkbin → Tron-Z 自有仓；同步：tools/pathless/sync-three-repos.sh
# PATHLESS_USE_OFFICIAL_SOURCES=yes：只换 git URL，仍依赖本仓 pathless DTB 补丁
# V2 DTB：暂缓

# 加载三仓 URL / 分支指针（须在 hook 里再 declare -g 覆盖家族默认）
[[ -f "${SRC}/config/sources/pathless-sources.conf" ]] && source "${SRC}/config/sources/pathless-sources.conf"
enable_extension "pathless-own-git"

BOARD_NAME="Pathless RK3566"
BOARD_VENDOR="pathless"
BOARDFAMILY="rk35xx"
BOARD_MAINTAINER="tron"
INTRODUCED="2026"
BOOTCONFIG="pathless-rk3566_defconfig"
BOOTCONFIG_SATA="pathless-rk3566-sata_defconfig"
BOOT_FDT_FILE="rockchip/rk3566-pathless-3b.dtb"
BOOT_SOC="rk3566"
KERNEL_TARGET="vendor,current,edge,bleedingedge"
FULL_DESKTOP="yes"
BOOT_LOGO="desktop"
IMAGE_PARTITION_TABLE="gpt"
BOOT_SCENARIO="binman"
BOOT_SUPPORT_SPI="yes"
BOOT_SPI_RKSPI_LOADER="yes"
INSTALL_ARMBIAN_FIRMWARE="no" # 不拉 github.com/armbian/firmware；固件走发行版 apt
SKIP_ARMBIAN_REPO="yes"       # 不写 tuna/armbian apt；内核 U-Boot 已本地打包

# Override family config for this board; let's avoid conditionals in family config.
function post_family_config__pathless_rk3566_use_mainline_uboot() {
	display_alert "$BOARD" "Using Pathless own-repos (branch:${BRANCH}) for $BOARD" "info"

	case "${BRANCH}" in
		vendor | current | edge | bleedingedge) ;;
		*)
			exit_with_error "$BOARD" "unsupported BRANCH='${BRANCH}'; need one of: ${PATHLESS_PRODUCT_BRANCHES}"
			;;
	esac

	# 默认走自有三仓、产品分支与 BRANCH 同名；调试可 PATHLESS_USE_OFFICIAL_SOURCES=yes 回退官方 URL
	# 注意：BOOT_FDT_FILE 仍为 pathless；官方树无该 DTB，须保留本仓 DT 补丁
	if [[ "${PATHLESS_USE_OFFICIAL_SOURCES:-no}" == "yes" ]]; then
		declare -g BOOTSOURCE="https://github.com/u-boot/u-boot.git"
		declare -g BOOTBRANCH="tag:v2026.01"
		declare -g RKBIN_GIT_URL="https://github.com/armbian/rkbin"
		declare -g RKBIN_GIT_BRANCH="master"
		case "${BRANCH}" in
			vendor)
				declare -g KERNELSOURCE="https://github.com/armbian/linux-rockchip.git"
				declare -g KERNELBRANCH="branch:rk-6.1-rkr7.2"
				;;
			# current/edge/bleedingedge：家族走 mainline（KERNELSOURCE 空 → stable）
		esac
		display_alert "$BOARD" "PATHLESS_USE_OFFICIAL_SOURCES=yes — upstream git URLs; pathless DTB patches still required" "wrn"
	else
		declare -g BOOTSOURCE="${PATHLESS_UBOOT_REPO}"
		declare -g BOOTBRANCH="branch:${BRANCH}"
		declare -g RKBIN_GIT_URL="${PATHLESS_RKBIN_REPO}"
		declare -g RKBIN_GIT_BRANCH="${BRANCH}"
		# 内核：vendor→BSP 自有仓；current/edge/bleedingedge→主线自有仓；分支名均=BRANCH
		if [[ "${BRANCH}" == "vendor" ]]; then
			declare -g KERNELSOURCE="${PATHLESS_KERNEL_BSP_REPO}"
		else
			declare -g KERNELSOURCE="${PATHLESS_KERNEL_MAINLINE_REPO}"
		fi
		declare -g KERNELBRANCH="branch:${BRANCH}"
	fi

	if [[ "${PATHLESS_USE_OFFICIAL_SOURCES:-no}" != "yes" ]]; then
		local _need="${PATHLESS_GIT_SERVER}"
		[[ "${KERNELSOURCE}" == "${_need}"* ]] || exit_with_error "$BOARD" "KERNELSOURCE must be own-repo under ${_need}, got '${KERNELSOURCE}'"
		[[ "${BOOTSOURCE}" == "${_need}"* ]] || exit_with_error "$BOARD" "BOOTSOURCE must be own-repo under ${_need}, got '${BOOTSOURCE}'"
		[[ "${RKBIN_GIT_URL}" == "${_need}"* ]] || exit_with_error "$BOARD" "RKBIN_GIT_URL must be own-repo under ${_need}, got '${RKBIN_GIT_URL}'"
	fi

	declare -g BOOTPATCHDIR="v2026.01"
	declare -g BOOTDELAY=1

	declare -g UBOOT_TARGET_MAP="BL31=${RKBIN_DIR}/${BL31_BLOB} ROCKCHIP_TPL=${RKBIN_DIR}/${DDR_BLOB} $BOOTCONFIG_SATA;;u-boot-rockchip-spi-sata.bin
	BL31=${RKBIN_DIR}/${BL31_BLOB} ROCKCHIP_TPL=${RKBIN_DIR}/${DDR_BLOB} $BOOTCONFIG;;u-boot-rockchip.bin u-boot-rockchip-spi.bin"
}

function pre_config_uboot_target__pathless_rk3566_patch_uboot_bootconfig_hack_for_sata() {
	display_alert "u-boot for ${BOARD}" "u-boot: hack bootconfig for sata spi image" "info"

	if [[ $target_make == *"pathless-rk3566-sata_defconfig"* ]]; then
		cp configs/pathless-rk3566_defconfig configs/pathless-rk3566-sata_defconfig
		echo "CONFIG_DWC_AHCI=y" >> configs/pathless-rk3566-sata_defconfig

		BOOTCONFIG="pathless-rk3566-sata_defconfig"
		target_make=${target_make/pathless-rk3566-sata_defconfig/}
	else
		BOOTCONFIG="pathless-rk3566_defconfig"
		target_make=${target_make/pathless-rk3566_defconfig/}
	fi
}

function post_config_uboot_target__pathless_rk3566_keep_sata_bootconfig() {
	display_alert "u-boot for ${BOARD}" "u-boot: keep sata bootconfig for package" "info"

	if [[ $BOOTCONFIG == "pathless-rk3566-sata_defconfig" ]]; then
		cp .config "${uboottempdir}/.config.sata"
	fi
}

function pre_package_uboot_image__pathless_rk3566_copy_sataconfig_to_package() {
	if [[ -f "${uboottempdir}/.config.sata" ]]; then
		run_host_command_logged cp "${uboottempdir}/.config.sata" "$uboottempdir/usr/lib/u-boot/pathless-rk3566-sata_defconfig"
		run_host_command_logged rm "${uboottempdir}/.config.sata"
	fi
}

function post_family_tweaks_bsp__pathless_rk3566() {
	display_alert "$BOARD" "Installing pathless-rk3566-sprd-bluetooth.service" "info"

	install -m 755 $SRC/packages/bsp/pathless-rk3566/hciattach_pathless $destination/usr/bin
	install -m 755 $SRC/packages/bsp/pathless-rk3566/pathless-rk3566-sprd-bluetooth $destination/usr/bin/
	cp $SRC/packages/bsp/pathless-rk3566/pathless-rk3566-sprd-bluetooth.service $destination/lib/systemd/system/

	return 0
}

function post_family_tweaks__pathless_rk3566_enable_services() {
	display_alert "$BOARD" "Enabling pathless-rk3566-sprd-bluetooth.service" "info"
	chroot_sdcard systemctl enable pathless-rk3566-sprd-bluetooth.service
	return 0
}

function post_family_tweaks__pathless_rk3566_naming_audios() {
	display_alert "$BOARD" "Renaming Pathless RK3566 audios" "info"

	mkdir -p $SDCARD/etc/udev/rules.d/
	echo 'SUBSYSTEM=="sound", ENV{ID_PATH}=="platform-hdmi-sound", ENV{SOUND_DESCRIPTION}="HDMI Audio"' > $SDCARD/etc/udev/rules.d/90-naming-audios.rules
	echo 'SUBSYSTEM=="sound", ENV{ID_PATH}=="platform-rk809-sound", ENV{SOUND_DESCRIPTION}="RK809 Audio"' >> $SDCARD/etc/udev/rules.d/90-naming-audios.rules # vendor dts
	echo 'SUBSYSTEM=="sound", ENV{ID_PATH}=="platform-sound", ENV{SOUND_DESCRIPTION}="RK809 Audio"' >> $SDCARD/etc/udev/rules.d/90-naming-audios.rules       # mainline dts

	return 0
}
