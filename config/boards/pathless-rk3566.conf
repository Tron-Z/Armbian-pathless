# Pathless RK3566
# 硬件参考：Orange Pi 3B V1.0（RK3566），工程内全部使用 Pathless 自有路径/文件名
#
# 自有启动资源：
#   BOOT_FDT_FILE → rockchip/rk3566-pathless-3b.dtb
#     vendor：patch/kernel/rk35xx-vendor-6.1/dt/rk3566-pathless-3b.dts
#     current/edge/bleedingedge：patch/kernel/archive/rockchip64-{6.18,7.2,7.3}/dt/
#   BOOTCONFIG    → patch/u-boot/v2026.01/defconfig/pathless-rk3566_defconfig
#   U-Boot DT     → patch/u-boot/v2026.01/dt_uboot + dt_upstream_rockchip（rk3566-pathless-3b*）
#   蓝牙 BSP      → packages/bsp/pathless-rk3566/
# 第三方源码三仓（方案 B）：config/sources/pathless-sources.conf
#   内核 / U-Boot / rkbin → Tron-Z 自有仓；同步：tools/pathless/sync-three-repos.sh
# PATHLESS_USE_OFFICIAL_SOURCES=yes：只换 git URL，仍依赖本仓 pathless DTB 补丁
# V2 DTB：暂缓

# 加载三仓 URL / 分支指针（须在 hook 里再 declare -g 覆盖家族默认）
[[ -f "${SRC}/config/sources/pathless-sources.conf" ]] && source "${SRC}/config/sources/pathless-sources.conf"
enable_extension "pathless-own-git"

BOARD_NAME="Pathless RK3566"
BOARD_VENDOR="pathless"
BOARDFAMILY="rk35xx"
BOARD_MAINTAINER="tron"

# Vendor branding + Orange Pi-style out-of-box login (no first-boot wizard).
VENDOR="${VENDOR:-Pathless}"
VENDORPRETTYNAME="${VENDORPRETTYNAME:-Pathless}"
VENDORURL="${VENDORURL:-https://duckduckgo.com/}"
VENDORSUPPORT="${VENDORSUPPORT:-}"
VENDORPRIVACY="${VENDORPRIVACY:-}"
VENDORBUGS="${VENDORBUGS:-}"
VENDORDOCS="${VENDORDOCS:-}"
VENDORLOGO="${VENDORLOGO:-distributor-logo}"
ROOTPWD="${ROOTPWD:-pathless}"
CONSOLE_AUTOLOGIN="${CONSOLE_AUTOLOGIN:-no}"
PATHLESS_USERNAME="${PATHLESS_USERNAME:-pathless}"
PATHLESS_PWD="${PATHLESS_PWD:-pathless}"
# Armbian rsync drops /home/* unless this is yes (Orange Pi image already ships a home dir).
INCLUDE_HOME_DIR=yes
# Daily-use CLI extras aligned with Orange Pi 3B (rk356x family_tweaks + packages.additional).
# Skip vendor-branded bits (orangepi-config/zsh, wiringOP, adbd gadget, hostapd/dnsmasq AP).
# GPIO: gpiod is already in Armbian packages.additional. Desktop stays BUILD_DESKTOP=yes opt-in.
PACKAGE_LIST_BOARD="net-tools vim tree zip python3 python3-pip python3-venv python3-serial bluetooth bluez bluez-tools lm-sensors v4l-utils usb-modeswitch bind9-dnsutils avahi-daemon libnss-mdns spi-tools picocom sysstat"
INTRODUCED="2026"
BOOTCONFIG="pathless-rk3566_defconfig"
BOOTCONFIG_SATA="pathless-rk3566-sata_defconfig"
BOOT_FDT_FILE="rockchip/rk3566-pathless-3b.dtb"
BOOT_SOC="rk3566"
KERNEL_TARGET="vendor,current,edge,bleedingedge"
FULL_DESKTOP="yes"
BOOT_LOGO="desktop"
IMAGE_PARTITION_TABLE="gpt"
BOOT_SCENARIO="binman"
BOOT_SUPPORT_SPI="yes"
BOOT_SPI_RKSPI_LOADER="yes"
INSTALL_ARMBIAN_FIRMWARE="no" # 不拉 github.com/armbian/firmware；固件走发行版 apt
SKIP_ARMBIAN_REPO="yes"       # 不写 tuna/armbian apt；内核 U-Boot 已本地打包

# Override family config for this board; let's avoid conditionals in family config.
function post_family_config__pathless_rk3566_use_mainline_uboot() {
	display_alert "$BOARD" "Using Pathless own-repos (branch:${BRANCH}) for $BOARD" "info"

	case "${BRANCH}" in
		vendor | current | edge | bleedingedge) ;;
		*)
			exit_with_error "$BOARD" "unsupported BRANCH='${BRANCH}'; need one of: ${PATHLESS_PRODUCT_BRANCHES}"
			;;
	esac

	# 默认走自有三仓、产品分支与 BRANCH 同名；调试可 PATHLESS_USE_OFFICIAL_SOURCES=yes 回退官方 URL
	# 注意：BOOT_FDT_FILE 仍为 pathless；官方树无该 DTB，须保留本仓 DT 补丁
	if [[ "${PATHLESS_USE_OFFICIAL_SOURCES:-no}" == "yes" ]]; then
		declare -g BOOTSOURCE="https://github.com/u-boot/u-boot.git"
		declare -g BOOTBRANCH="tag:v2026.01"
		declare -g RKBIN_GIT_URL="https://github.com/armbian/rkbin"
		declare -g RKBIN_GIT_BRANCH="master"
		case "${BRANCH}" in
			vendor)
				declare -g KERNELSOURCE="https://github.com/armbian/linux-rockchip.git"
				declare -g KERNELBRANCH="branch:rk-6.1-rkr7.2"
				;;
			# current/edge/bleedingedge：家族走 mainline（KERNELSOURCE 空 → stable）
		esac
		display_alert "$BOARD" "PATHLESS_USE_OFFICIAL_SOURCES=yes — upstream git URLs; pathless DTB patches still required" "wrn"
	else
		declare -g BOOTSOURCE="${PATHLESS_UBOOT_REPO}"
		declare -g BOOTBRANCH="branch:${BRANCH}"
		declare -g RKBIN_GIT_URL="${PATHLESS_RKBIN_REPO}"
		declare -g RKBIN_GIT_BRANCH="${BRANCH}"
		# 内核：vendor→BSP 自有仓；current/edge/bleedingedge→主线自有仓；分支名均=BRANCH
		if [[ "${BRANCH}" == "vendor" ]]; then
			declare -g KERNELSOURCE="${PATHLESS_KERNEL_BSP_REPO}"
		else
			declare -g KERNELSOURCE="${PATHLESS_KERNEL_MAINLINE_REPO}"
		fi
		declare -g KERNELBRANCH="branch:${BRANCH}"
	fi

	if [[ "${PATHLESS_USE_OFFICIAL_SOURCES:-no}" != "yes" ]]; then
		local _need="${PATHLESS_GIT_SERVER}"
		[[ "${KERNELSOURCE}" == "${_need}"* ]] || exit_with_error "$BOARD" "KERNELSOURCE must be own-repo under ${_need}, got '${KERNELSOURCE}'"
		[[ "${BOOTSOURCE}" == "${_need}"* ]] || exit_with_error "$BOARD" "BOOTSOURCE must be own-repo under ${_need}, got '${BOOTSOURCE}'"
		[[ "${RKBIN_GIT_URL}" == "${_need}"* ]] || exit_with_error "$BOARD" "RKBIN_GIT_URL must be own-repo under ${_need}, got '${RKBIN_GIT_URL}'"
	fi

	declare -g BOOTPATCHDIR="v2026.01"
	declare -g BOOTDELAY=1

	declare -g UBOOT_TARGET_MAP="BL31=${RKBIN_DIR}/${BL31_BLOB} ROCKCHIP_TPL=${RKBIN_DIR}/${DDR_BLOB} $BOOTCONFIG_SATA;;u-boot-rockchip-spi-sata.bin
	BL31=${RKBIN_DIR}/${BL31_BLOB} ROCKCHIP_TPL=${RKBIN_DIR}/${DDR_BLOB} $BOOTCONFIG;;u-boot-rockchip.bin u-boot-rockchip-spi.bin"

	# current/edge: WiFi/BT DT is off; loading sprdbt_tty oopses (NULL marlin).
	if [[ "${BRANCH}" != "vendor" ]]; then
		declare -g MODULES_BLACKLIST="${MODULES_BLACKLIST:+${MODULES_BLACKLIST} }sprdbt_tty sprdwl_ng uwe5622_bsp_sdio"
	fi
}

function pre_config_uboot_target__pathless_rk3566_patch_uboot_bootconfig_hack_for_sata() {
	display_alert "u-boot for ${BOARD}" "u-boot: hack bootconfig for sata spi image" "info"

	if [[ $target_make == *"pathless-rk3566-sata_defconfig"* ]]; then
		cp configs/pathless-rk3566_defconfig configs/pathless-rk3566-sata_defconfig
		echo "CONFIG_DWC_AHCI=y" >> configs/pathless-rk3566-sata_defconfig

		BOOTCONFIG="pathless-rk3566-sata_defconfig"
		target_make=${target_make/pathless-rk3566-sata_defconfig/}
	else
		BOOTCONFIG="pathless-rk3566_defconfig"
		target_make=${target_make/pathless-rk3566_defconfig/}
	fi
}

function post_config_uboot_target__pathless_rk3566_keep_sata_bootconfig() {
	display_alert "u-boot for ${BOARD}" "u-boot: keep sata bootconfig for package" "info"

	if [[ $BOOTCONFIG == "pathless-rk3566-sata_defconfig" ]]; then
		cp .config "${uboottempdir}/.config.sata"
	fi
}

function pre_package_uboot_image__pathless_rk3566_copy_sataconfig_to_package() {
	if [[ -f "${uboottempdir}/.config.sata" ]]; then
		run_host_command_logged cp "${uboottempdir}/.config.sata" "$uboottempdir/usr/lib/u-boot/pathless-rk3566-sata_defconfig"
		run_host_command_logged rm "${uboottempdir}/.config.sata"
	fi
}

function post_family_tweaks_bsp__pathless_rk3566() {
	display_alert "$BOARD" "Installing pathless-rk3566-sprd-bluetooth.service" "info"

	install -m 755 $SRC/packages/bsp/pathless-rk3566/hciattach_pathless $destination/usr/bin
	install -m 755 $SRC/packages/bsp/pathless-rk3566/pathless-rk3566-sprd-bluetooth $destination/usr/bin/
	cp $SRC/packages/bsp/pathless-rk3566/pathless-rk3566-sprd-bluetooth.service $destination/lib/systemd/system/

	install -d "$destination/usr/lib/pathless" "$destination/usr/lib/armbian" "$destination/usr/share/pathless"
	install -m 755 "$SRC/packages/bsp/pathless-rk3566/pathless-firstlogin" "$destination/usr/lib/armbian/armbian-firstlogin"
	install -m 755 "$SRC/packages/bsp/pathless-rk3566/pathless-firstrun-config" "$destination/usr/lib/pathless/pathless-firstrun-config"
	install -m 644 "$SRC/packages/bsp/pathless-rk3566/pathless-firstrun-config.service" "$destination/lib/systemd/system/"
	install -m 644 "$SRC/packages/bsp/pathless-rk3566/pathless_first_run.txt.template" "$destination/usr/share/pathless/pathless_first_run.txt.template"

	install -d "$destination/etc/update-motd.d" "$destination/etc/default"
	install -m 755 "$SRC/packages/bsp/pathless-rk3566/update-motd.d/10-armbian-header" "$destination/etc/update-motd.d/10-armbian-header"
	install -m 755 "$SRC/packages/bsp/pathless-rk3566/update-motd.d/30-armbian-sysinfo" "$destination/etc/update-motd.d/30-armbian-sysinfo"
	install -m 755 "$SRC/packages/bsp/pathless-rk3566/update-motd.d/40-pathless-updates" "$destination/etc/update-motd.d/40-pathless-updates"
	install -m 644 "$SRC/packages/bsp/pathless-rk3566/armbian-motd" "$destination/etc/default/armbian-motd"
	install -m 644 "$SRC/packages/bsp/pathless-rk3566/armbian-motd" "$destination/etc/default/armbian-motd.dpkg-dist"
	echo "BRANCH=${BRANCH}" >> "$destination/etc/armbian-release"

	return 0
}

function post_family_tweaks__pathless_rk3566_enable_services() {
	if [[ "${BRANCH}" == "vendor" ]]; then
		display_alert "$BOARD" "Enabling pathless-rk3566-sprd-bluetooth.service" "info"
		chroot_sdcard systemctl enable pathless-rk3566-sprd-bluetooth.service
	else
		display_alert "$BOARD" "Not enabling sprd bluetooth on BRANCH=${BRANCH} (uwe-bsp disabled)" "info"
		chroot_sdcard systemctl disable pathless-rk3566-sprd-bluetooth.service || true
	fi
	chroot_sdcard systemctl enable pathless-firstrun-config.service || true
	return 0
}

# Pre-create daily user like Orange Pi (orangepi/orangepi → pathless/pathless).
function post_family_tweaks__pathless_rk3566_default_user() {
	local u="${PATHLESS_USERNAME:-pathless}"
	local p="${PATHLESS_PWD:-pathless}"

	if [[ -f "${SRC}/packages/bsp/pathless-rk3566/pathless_first_run.txt.template" ]]; then
		install -m 644 "${SRC}/packages/bsp/pathless-rk3566/pathless_first_run.txt.template" \
			"${SDCARD}/boot/pathless_first_run.txt.template"
	fi

	if grep -q "^${u}:" "${SDCARD}/etc/passwd" 2>/dev/null; then
		display_alert "$BOARD" "Default user ${u} already exists" "info"
	else
		display_alert "$BOARD" "Creating default user ${u}" "info"
		chroot_sdcard useradd --create-home --home-dir "/home/${u}" --shell /bin/bash --comment "${u}" --user-group "${u}"
		# chroot_sdcard joins args into bash -c "$*"; same quoting as passwd root in distro-agnostic.sh
		chroot_sdcard echo "'${u}:${p}'" "|" chpasswd
		if [[ ! -d "${SDCARD}/home/${u}" ]]; then
			mkdir -p "${SDCARD}/home/${u}"
			cp -a "${SDCARD}/etc/skel/." "${SDCARD}/home/${u}/" 2>/dev/null || true
		fi
		for additionalgroup in sudo netdev audio video disk tty users games dialout plugdev input bluetooth systemd-journal ssh render docker; do
			chroot_sdcard usermod -aG "${additionalgroup}" "${u}" || true
		done
		touch "${SDCARD}/home/${u}/.Xauthority"
		chroot_sdcard chown -R "${u}:${u}" "/home/${u}"
	fi

	if [[ -d "${SDCARD}/etc/lightdm" ]]; then
		mkdir -p "${SDCARD}/etc/lightdm/lightdm.conf.d"
		cat <<- EOF > "${SDCARD}/etc/lightdm/lightdm.conf.d/22-pathless-autologin.conf"
			[Seat:*]
			autologin-user=${u}
			autologin-user-timeout=0
			user-session=xfce
		EOF
	fi
	if [[ -d "${SDCARD}/etc/gdm3" ]]; then
		cat <<- EOF > "${SDCARD}/etc/gdm3/custom.conf"
			[daemon]
			AutomaticLoginEnable = true
			AutomaticLogin = ${u}
		EOF
	fi
	return 0
}

# Mainline gates unused clocks/power domains before /init; udev re-enabling
# VPU/USB/GPU then hard-resets RK3566. Vendor BSP does not do this.
function post_family_tweaks__pathless_rk3566_mainline_bootargs() {
	[[ "${BRANCH}" == "vendor" ]] && return 0
	local envfile="${SDCARD}/boot/armbianEnv.txt"
	[[ -f "${envfile}" ]] || return 0
	if grep -q 'clk_ignore_unused' "${envfile}"; then
		return 0
	fi
	if grep -q '^extraargs=' "${envfile}"; then
		sed -i 's/^extraargs=\(.*\)$/extraargs=\1 clk_ignore_unused pd_ignore_unused/' "${envfile}"
	else
		echo "extraargs=clk_ignore_unused pd_ignore_unused" >> "${envfile}"
	fi
}

# Armbian nsswitch drops mdns; restore it so pathless-rk3566.local resolves (Orange Pi ships avahi).
function post_family_tweaks__pathless_rk3566_mdns() {
	local nss="${SDCARD}/etc/nsswitch.conf"
	[[ -f "${nss}" ]] || return 0
	if grep -q 'mdns' "${nss}"; then
		return 0
	fi
	sed -i 's/^hosts:.*/hosts:          files mymachines mdns4_minimal [NOTFOUND=return] dns myhostname/' "${nss}"
	chroot_sdcard systemctl enable avahi-daemon.service || true
	return 0
}

function post_family_tweaks__pathless_rk3566_naming_audios() {
	display_alert "$BOARD" "Renaming Pathless RK3566 audios" "info"

	mkdir -p $SDCARD/etc/udev/rules.d/
	echo 'SUBSYSTEM=="sound", ENV{ID_PATH}=="platform-hdmi-sound", ENV{SOUND_DESCRIPTION}="HDMI Audio"' > $SDCARD/etc/udev/rules.d/90-naming-audios.rules
	echo 'SUBSYSTEM=="sound", ENV{ID_PATH}=="platform-rk809-sound", ENV{SOUND_DESCRIPTION}="RK809 Audio"' >> $SDCARD/etc/udev/rules.d/90-naming-audios.rules # vendor dts
	echo 'SUBSYSTEM=="sound", ENV{ID_PATH}=="platform-sound", ENV{SOUND_DESCRIPTION}="RK809 Audio"' >> $SDCARD/etc/udev/rules.d/90-naming-audios.rules       # mainline dts

	return 0
}

# Armbian disables MOTD until firstlogin wizard; Pathless has no wizard and the
# daily user is not root, so firstlogin never re-enables it. Restore on image.
function pre_umount_final_image__pathless_rk3566_enable_motd() {
	display_alert "$BOARD" "Enabling login MOTD (header/sysinfo)" "info"
	if [[ -d "${MOUNT}/etc/update-motd.d" ]]; then
		chmod +x "${MOUNT}/etc/update-motd.d/"* || true
	fi
	return 0
}
